  albums:
  - title: Roy Orbison at the Rock House
    year: 1961
    format: Compilation
    cells:
    - players:
      - name: Roy Orbison
        instrument: lead vocals, lead guitar
      - name: The Teen Kings
        instrument: backing band
    - Sam Phillips, producer; other musicians, details limited
    - >-
      Sun. An archival release: recorded at Sun in 1956–58 and issued in December 1961, after
      Orbison had gone to Monument, to capitalize on his success there. Rockabilly rather than
      ballads, mostly Orbison originals though the writing credits went to Phillips; most tracks
      were overdubbed later. Retitled *The Exciting Sounds of Roy Orbison* in the UK (1964, #17).
- name: THE MONUMENT YEARS
  years: 1961–1962
  descriptor: Nashville's Operatic Heartbreak
  columns:
  - Album / Year
  - Artist's Role
  - Producers & Key Musicians
  - Label / Notes
  albums:
  - title: Lonely and Blue
    year: 1961
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals
    - >-
      Fred Foster, producer; Boots Randolph (sax, on "I'll Say It's My Fault"); full personnel,
      details limited
    - >-
      Monument. His debut album, cut mainly in September 1960 at RCA Studio B in Nashville.
      "Only the Lonely" (#2 US, #1 UK), "Blue Angel" (#9) and "I'm Hurtin'" (#27) were hit singles;
      the rest mixes country and pop covers such as "Bye Bye Love" and "I Can't Stop Loving You."
      Reached #14 in the UK in 1963.
  - title: Crying
    year: 1962
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals, guitar
    - >-
      Fred Foster, producer; Bill Porter, engineer. Session players include Hank Garland, Scotty
      Moore and Grady Martin (guitar), Bob Moore (bass), Floyd Cramer (piano), Buddy Harman and
      John Greubel (drums), Charlie McCoy (harmonica), Boots Randolph and Harry Johnson (sax)
    - >-
      Monument. Recorded at RCA Victor Studio B, Nashville. Holds two of his biggest singles,
      "Running Scared" (#1 on the Hot 100) and the title song (#2), alongside covers of "The
      Great Pretender" and "Love Hurts." The album reached #21 in the US and #17 in the UK. The
      title song later earned a Grammy Hall of Fame award (2002).
- name: THE BIG HITS
  years: 1963
  descriptor: In Dreams
  columns:
  - Album / Year
  - Artist's Role
  - Producers & Key Musicians
