artist: Roy Orbison
title: 'Roy Orbison: Landmark Albums & Collaborations'
subtitle: Musicians & Instrumentation (1961–1989)
synopsis:
- >-
  **Roy Orbison** was born in Vernon, Texas, in 1936 and started out as a rockabilly: his band the
  Teen Kings cut "Ooby Dooby" in Clovis, New Mexico, in 1956, and he then signed to **Sam Phillips**'
  Sun Records. Sun never found a way to use the voice. His breakthrough came after he left, at
  Nashville's **Monument Records** under producer **Fred Foster**, who recorded him at RCA Victor's
  Studio B with the city's top session players. "Only the Lonely" (1960), "Running Scared" and
  "Crying" (1961), "In Dreams" (1963) and "Oh, Pretty Woman" (1964) were operatic, minor-key
  songs of heartbreak, built on his own writing (often with Joe Melson or Bill Dees) and a
  three-octave voice that made the dark glasses and the stillness onstage feel like part of the song.
- >-
  The Monument records are the core of his legacy. They were singles-driven, but *Lonely and Blue*
  (1961) and *Crying* (1962) show Foster's approach at album length: sparse rhythm sections, strings
  and backing vocals used as drama, and Orbison singing ballads, pop standards and country songs
  as if they were all his. In mid-1965 he left for **MGM** on a reported million-dollar deal
  covering years of albums and film work, with manager **Wesley Rose** now producing. The records
  that followed, from *There Is Only One Roy Orbison* on, were more varied and less
  distinctive, and the film ambitions fizzled with *The Fastest Guitar Alive* (1967). Hits dried
  up in the US while he stayed popular in Britain and Australia.
- >-
  The personal toll was severe. His wife Claudette was killed in a motorcycle accident in June
  1966, and in September 1968, while he was on tour in Britain, a fire at his Hendersonville home
  killed his two eldest sons. Records from this period, such as *Roy Orbison's Many Moods* (1969),
  mostly show a professional singer carrying on, with covers of standards beside songs co-written
  with Dees. The 1970s were lean: a one-off for Mercury, a return to Monument for *Regeneration*
  (1976), open-heart surgery in January 1978, and *Laminar Flow* (1979) on Asylum, cut in Muscle
  Shoals. Meanwhile other artists kept his songs alive, including Linda Ronstadt's "Blue Bayou"
  and Don McLean's "Crying."
- >-
  The revival came in the 1980s. The 1986 film *Blue Velvet* used "In Dreams," he was inducted into
  the Rock and Roll Hall of Fame in 1987, and a new deal with Virgin brought him together with
  **Jeff Lynne**. That led to the **Traveling Wilburys**, the supergroup with **George Harrison**,
  **Bob Dylan**, Lynne and **Tom Petty**, whose first album came out in October 1988. Orbison died of a
  heart attack on December 6, 1988, at 52, shortly after finishing his own comeback record. *Mystery
  Girl* (1989), with Lynne, Petty, Harrison and Bono among the contributors, was his highest-charting US album and
  closed the catalog as a living artist's work. Since then the estate has issued live sets and
  orchestral reworkings of his vocals, but nothing that changes the picture.
scope_note: >-
  Scope: a landmark selection of studio albums across Orbison's career, 1961–1989, not a full
  inventory (the MGM years alone produced more than a dozen LPs, and only the most useful are covered).
  Included on request: *Traveling Wilburys Vol. 1* (1988), a group release credited to a band
  Orbison was one member of, tagged as such. Excluded: live albums (*A Black & White Night Live*,
  *The Last Concert*), the 1987 re-recording set *In Dreams: The Greatest Hits*, compilations
  and box sets, *Class of '55* (1986, a multi-artist reunion album), the posthumous orchestral
  albums *A Love So Beautiful* (2017) and *Unchained Melodies* (2018), the posthumous
  *King of Hearts* (1992) and *One of the Lonely Ones* (2015), and film soundtracks. *Roy Orbison
  at the Rock House* (1961) is a contested case: it is an archival Sun release assembled after he
  had left the label, with overdubs added, so it is tagged as such. A search for 2025–2026
  releases found nothing confirmed. Personnel are given where sources name them; many MGM-era
  musician credits are "details limited."
