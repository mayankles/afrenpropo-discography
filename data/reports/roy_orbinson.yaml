  albums:
  - title: In Dreams
    year: 1963
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals
    - Fred Foster, producer; session personnel, details limited
    - >-
      Monument. Recorded at RCA Victor Studio B. The title track reached #7 on the Hot 100 and
      #6 in the UK, and was later used to chilling effect in *Blue Velvet* (1986). "Blue Bayou"
      (written with Joe Melson) peaked at #29 in the US and #3 in the UK, and was later a
      huge hit for Linda Ronstadt. Also covers "Dream," "All I Have to Do Is Dream" and "My
      Prayer." The album reached #35 in the US and #6 in the UK.
- name: THE MGM YEARS
  years: 1965–1979
  descriptor: Big Contract, Private Tragedy
  columns:
  - Album / Year
  - Artist's Role
  - Producers & Key Musicians
  - Label / Notes
  albums:
  - title: There Is Only One Roy Orbison
    year: 1965
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals
    - Wesley Rose & Jim Vienneau, producers; session musicians, details limited
    - >-
      MGM. His first MGM album, recorded at RCA Studios, Nashville, after his Monument contract
      expired. The move was reported to be worth $1 million. Includes "Ride Away" (#25 US)
      and a re-cut of his own "Claudette." Reached #55 in the US and #10 in the UK.
  - title: Roy Orbison's Many Moods
    year: 1969
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals
    - >-
      Wesley Rose, producer; Val Valentin, engineer; arrangements by Jim Hall and Emory Gordy
      Jr. on some tracks; session personnel, details limited
    - >-
      MGM. Written when he was in the aftermath of the 1966 and 1968 family tragedies. Part
      originals ("Heartache," "Walk On" and "Yesterday's Child," co-written with Bill Dees), part
      covers ("Unchained Melody," "More," "What Now, My Love"). Singles charted in the UK at #44
      and #39. "Heartache" was re-recorded for *I'm Still in Love with You* (1975).
- name: THE WILDERNESS & THE COMEBACK
  years: 1979–1989
  descriptor: Muscle Shoals, Wilburys & Mystery Girl
  columns:
  - Album / Year
  - Artist's Role
  - Producers & Key Musicians
  - Label / Notes
  albums:
  - title: Laminar Flow
    year: 1979
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals
    - >-
      Clayton Ivey & Terry Woodford, producers; Larry Byrom, Mac McAnally (guitar), Jim Horn
      (sax), Bob Wray and Lonnie Ledford (bass), Lenny LeBlanc (drums), Ivey (keyboards)
    - >-
      Asylum. Recorded in February 1979 at Wishbone Studio, Muscle Shoals, a year after his
      open-heart surgery. A soft-rock record with singles "Easy Way Out" and "Poor Baby"; the
      closing "Hound Dog Man" is a tribute to Elvis Presley. Commercially it did little.
  - title: Traveling Wilburys Vol. 1
    year: 1988
    format: Traveling Wilburys (group release)
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals (as Lefty Wilbury)
      - name: George Harrison
        instrument: vocals, guitars (as Nelson Wilbury)
      - name: Jeff Lynne
        instrument: vocals, guitars, keyboards, bass (as Otis Wilbury)
      - name: Bob Dylan
        instrument: vocals, guitar (as Lucky Wilbury)
      - name: Tom Petty
        instrument: vocals, guitar (as Charlie T. Wilbury Jr.)
    - >-
      Jeff Lynne & George Harrison, producers (as Otis and Nelson Wilbury); Jim Keltner (drums),
      Jim Horn (sax), Ray Cooper (percussion), Ian Wallace (toms on "Handle with Care")
    - >-
      Wilbury/Warner Bros. "Handle with Care" was taped at Dylan's Malibu home, and the rest
      was cut in nine days in May 1988 at Dave Stewart's studio in Los Angeles, with overdubs
      at Harrison's studio in Henley-on-Thames. A supergroup album, not a solo record. Reached
      #3 in the US (triple platinum) and #16 in the UK, and won the 1990 Grammy for best rock
      performance by a duo or group. Orbison died less than two months after release.
  - title: Mystery Girl
    year: 1989
    cells:
    - players:
      - name: Roy Orbison
        instrument: vocals
    - >-
      Jeff Lynne (most tracks), Mike Campbell, Bono ("She's a Mystery to Me," written with the
      Edge), T Bone Burnett and Barbara Orbison, producers; Tom Petty, George Harrison, Mike
      Campbell, Howie Epstein, Benmont Tench, Jim Keltner
    - >-
      Virgin. Posthumous: recorded July 1987–November 1988 at Rumbo Recorders, A&M Studios and
      FPSHOT, and released January 30, 1989 (UK). "You Got It" reached #9 on the Hot 100. His
      highest-charting US album (#5) and #2 in the UK.
