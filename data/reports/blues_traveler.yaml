        instrument: drums
    - >-
      Jim Gaines and Blues Traveler, producers; Gregg Allman (Hammond B3, vocals on "Mountain
      Cry"), Chris Barron (backing vocals)
    - >-
      A&M. Recorded in 1991 at Master Sound in Astoria, Queens, and RPM Studios in Manhattan; released
      September 3. Singles were "All in the Groove," "Sweet Pain" and "Mountain Cry." Peaked at
      No. 125 and went gold. An early two-CD pressing bundled the live *On Tour Forever*.
  - title: Save His Soul
    year: 1993
    cells:
    - players:
      - name: John Popper
        instrument: vocals, harmonica
      - name: Chan Kinchla
        instrument: guitar
      - name: Bobby Sheehan
        instrument: bass
      - name: Brendan Hill
        instrument: drums
    - >-
      Dave Swanson and Blues Traveler, producers; Paul Shaffer (Hammond organ), Avram Lavinsky
      (string arrangements), a string section and backing vocalists
    - >-
      A&M. Singles "Conquer Me" and "Defense & Desire," the latter about Manhattan's Nightingale
      Bar. "Letter from a Friend" was written for Dave Graham, son of promoter Bill Graham, after
      his death in 1991. Peaked at No. 72 and went gold; the band had co-founded H.O.R.D.E. the
      year before.
