      Justin Niebank, producer; Joan Osborne (backing vocals), Howie Wyeth (piano), Arnie Lawrence
      (soprano sax), Chris Barron (backing vocals)
    - >-
      A&M. Recorded February 19 to March 3, 1990, and released that May. Jam-structured songs built
      on basic blues riffs, with Popper's harmonica at the centre. Peaked at No. 136 on the Billboard
      200 and later went gold.
  - title: Travelers and Thieves
    year: 1991
    cells:
    - players:
      - name: John Popper
        instrument: vocals, harmonica
      - name: Chan Kinchla
        instrument: guitar
      - name: Bobby Sheehan
