artist: Blues Traveler
subtitle: Musicians & Instrumentation (1990–2023)
synopsis:
- >-
  **John Popper** and **Brendan Hill** started playing together in high school in Princeton, New
  Jersey, in the mid-1980s, in a garage band that went through names such as the Establishment
  and Blues Band before settling on Blues Traveler, a nod to Gozer the Traveler from *Ghostbusters*.
  Guitarist **Chan Kinchla** and bassist **Bobby Sheehan** completed the lineup that moved to
  New York, played the club circuit, and signed with A&M Records. Popper is the band's centre
  of gravity: a singer and songwriter whose harmonica playing, fast enough to be a calling card
  and a running joke, treats the instrument as a lead guitar. Around him, Chan Kinchla supplies
  guitar and mandolin, Hill the drums and percussion, and Sheehan was the melodic, elastic bass
  underneath. The self-titled debut (1990) captured a jam-structured band built on blues riffs,
  and *Travelers and Thieves* (1991) and *Save His Soul* (1993) deepened it while the live
  following grew. In 1992 the band helped found the H.O.R.D.E. touring festival, a template for
  the jam-band circuit of the decade.
- >-
  *Four* (1994) turned that cult following into a mainstream hit. Recorded at Bearsville Studios
  in Woodstock, New York, with producers **Michael Barbiero** and **Steve Thompson**, it peaked
  at No. 8 on the Billboard 200, went six times platinum in the U.S., and produced "Run-Around"
  (No. 8 on the Hot 100, and the 1995 Grammy winner for Best Rock Performance by a Duo or Group)
  and "Hook." The same team returned for *Straight On till Morning* (1997), which reached No. 11
  and went platinum. It would be the last album with Sheehan. He died of an accidental drug
  overdose in New Orleans on August 20, 1999, and the band had to decide whether to continue.
  They did, adding **Tad Kinchla**, Chan's younger brother, on bass after an audition, and
  keyboardist **Ben Wilson** in January 2000, which gave the group a keyboard voice it had never
  had before.
- >-
  The post-Sheehan years were rebuilding years. A free online release in 2000, *Decisions of the
  Sky*, came first, then *Bridge* (2001), the band's last album for A&M, which dropped them in
  2002. Since then Blues Traveler has worked across a string of labels, among them Sanctuary,
  Vanguard, Verve Forecast, 429, Loud & Proud, BMG and Round Hill, and has largely stayed
  independent of the major-label chart game while remaining a reliable touring act, a regular
  July 4 headliner at Red Rocks since 1994 (except 1999 and 2020). The albums of this era range
  widely: a producer-driven roots record with the late Jay Bennett (*¡Bastardos!*, 2005), a
  record built entirely on guest duets with younger pop and rock acts (*Blow Up the Moon*, 2015),
  and a pair of covers albums, one of blues standards and one of soul.
- >-
  *Traveler's Blues* (2021), produced by **Matt Rollings** with guests including Keb' Mo',
  Warren Haynes, Kingfish Ingram and The War and Treaty, reached No. 1 on Billboard's Top Blues
  Albums chart and was nominated for the Grammy for Best Traditional Blues Album. *Traveler's
  Soul* (2023) followed with R&B and soul covers. In 2024 the band toured *Four* in full for
  its thirtieth anniversary, and in 2025 it co-headlined with Gin Blossoms and Spin Doctors,
  releasing a cover of R. Dean Taylor's "Indiana Wants Me" with them, with further 2026 dates
  announced. All five members of the current lineup (Popper, Chan Kinchla, Hill, Tad Kinchla and
  Wilson) are still together, though no new studio album since *Traveler's Soul* turned up in
  research for this report.
scope_note: >-
  Scope: covers Blues Traveler's studio albums, 1990–2023, sixteen in all, plus *Decisions of
  the Sky* (2000), which was released free online as a short digital set rather than a
  conventional album and is tagged as such. Excluded: live albums (*Live from the Fall*, *Live:
  What You and I Have Been Through*, *Live on the Rocks*, *On Tour Forever*, *¡Bastardos en
  Vivo!*), compilations (*Travelogue*, *25*, *Icon*, *The Definitive Collection*), and members'
  solo work, including John Popper's solo albums and side projects, since Blues Traveler itself
  has been the constant. Contested or unverified details are flagged in the rows: several
  producer credits and the label of *Cover Yourself* conflict between sources or could not be
  confirmed. *Blow Up the Moon*, *Traveler's Blues* and *Traveler's Soul* are tagged by format
  because they are guest-driven or cover records. Years follow the discography listing, so
  *Traveler's Blues* is dated 2021 although its release was reported as delayed from July to
  October.
