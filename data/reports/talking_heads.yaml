    - >-
      Sire. Built at Compass Point and Sigma Sound from studio jams layering interlocking, single-chord
      grooves inspired by Fela Kuti and King Sunny Adé. A dispute over songwriting credits — advance
      pressings read "Byrne, Eno, Talking Heads" rather than naming all four members — left Frantz
      and Weymouth feeling sidelined and ended the band's collaboration with Eno. Selected for
      the National Recording Registry in 2017; gold in the U.S. and Canada.
