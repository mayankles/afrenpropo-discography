      Dickens & Diva Gray
    - >-
      Sire/EMI. A country- and roots-flavored turn away from *Remain in Light*'s polyrhythms.
      Howard Finster's cover art won Rolling Stone's album cover of the year; the album itself
      topped the Village Voice Pazz & Jop critics' poll and became the band's best-selling studio
      record, with "And She Was" and "Road to Nowhere" as its singles.
