# Extracted from the hand-generated Talking Heads report; re-rendering this
# file reproduces that page exactly, so it doubles as a regression fixture.

artist: Talking Heads
title: 'Talking Heads: Studio Albums Discography'
subtitle: Musicians & Instrumentation (1977–1988)
synopsis:
- >-
  **David Byrne** and **Chris Frantz** started playing together as the Artistics at the Rhode
  Island School of Design in 1973, then moved to New York and recruited Frantz's girlfriend **Tina
  Weymouth** on bass — she learned the instrument specifically for the job, auditioning three
  times before Byrne would take her. As Talking Heads, the trio played their first show on June
  5, 1975, opening for the Ramones at CBGB, and signed to Sire Records in November 1976. **Jerry
  Harrison**, formerly of the Modern Lovers, joined on keyboards and guitar in January 1977, completing
  the lineup that would stay fixed for the rest of the band's existence. Their debut, *Talking
  Heads: 77*, produced by Tony Bongiovi and Lance Quinn, translated the nervous, cerebral energy
  of the Bowery scene into something tighter and stranger than punk — clipped guitar figures,
  deadpan vocals, and "Psycho Killer" as its calling card.
- >-
  The band's defining transformation came from three consecutive albums produced by **Brian Eno**.
  *More Songs About Buildings and Food* (1978), cut at Compass Point in Nassau, loosened the debut's
  tension into funkier, more textured arrangements and gave the band a hit with its cover of Al
  Green's "Take Me to the River." *Fear of Music* (1979) pushed further into paranoid, polyrhythmic
  territory, with King Crimson's Robert Fripp guesting on guitar. *Remain in Light* (1980) went
  further still, building layered, single-chord grooves modeled on Fela Kuti and King Sunny Adé
  with an expanded cast including Adrian Belew, Jon Hassell, and Nona Hendryx. It's now regarded
  as the band's masterpiece, but making it fractured the group: advance pressings credited the
  songwriting to "Byrne, Eno, Talking Heads" rather than all four members by name, Frantz and
  Weymouth felt sidelined during the New York sessions, and the ensuing dispute ended the band's
  working relationship with Eno.
- >-
  A three-year hiatus followed, during which Weymouth and Frantz launched the hit side project
  Tom Tom Club and Byrne and Eno released *My Life in the Bush of Ghosts*. Talking Heads regrouped
  to self-produce (with Alex Sadkin) 1983's *Speaking in Tongues*, whose "Burning Down the House"
  became their only U.S. top-ten single and whose limited Robert Rauschenberg-designed sleeve
  won a Grammy. Jonathan Demme's concert film *Stop Making Sense* (1984) captured the band at
  its live peak with an expanded touring ensemble, though it isn't a studio release. *Little Creatures*
  (1985) and *True Stories* (1986, tied to Byrne's own film of the same name) pivoted toward American
  roots and pop songcraft and became the band's commercial high-water mark, before *Naked* (1988),
  cut in Paris with Steve Lillywhite and guests including Johnny Marr, returned to the worldbeat
  sound of *Remain in Light*.
- >-
  Talking Heads dissolved in December 1991; Frantz has said he learned of Byrne's departure from
  a Los Angeles Times article rather than from Byrne directly. The remaining three toured and
  recorded as The Heads in the mid-1990s, a name Byrne opposed as trading on the band's legacy,
  and the personal rift has lingered in public since — Weymouth has called Byrne "incapable of
  returning friendship." A brief reunion took place at their 2002 Rock and Roll Hall of Fame induction,
  and the four appeared together again in 2023 around the IMAX reissue of *Stop Making Sense*,
  though Byrne has repeatedly ruled out a reunion tour or new music; the band reportedly turned
  down an $80 million tour offer in early 2024. In June 2025, marking the band's 50th anniversary,
  they released a new "Psycho Killer" music video directed by Mike Mills and starring Saoirse
  Ronan.
scope_note: >-
  Scope: covers all eight Talking Heads studio albums, 1977–1988. Excluded: live albums (*The
  Name of This Band Is Talking Heads*, *Stop Making Sense*), compilations and remix releases,
  the 2018 expanded *True Stories* soundtrack combining the film cast's versions (distinct from
  the band's own *True Stories* album, which is included), and post-breakup work released under
  the name The Heads (1996), which Byrne never took part in. Also out of scope, per the default
  for a single-band catalog: members' side and solo projects (Tom Tom Club, Jerry Harrison's and
  David Byrne's solo work, *My Life in the Bush of Ghosts*), since Talking Heads itself was the
  constant rather than a rotating cast of side bands.
