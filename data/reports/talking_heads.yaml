    - >-
      Sire. Sessions began in Frantz and Weymouth's Long Island City loft before moving to several
      New York studios (the Hit Factory, Atlantic, R.P.M., Record Plant). Paranoid, geopolitically
      charged lyrics over increasingly unconventional rhythms; the embossed, tread-plate cover
      was Grammy-nominated for Best Recording Package. Gold-certified in 1985.
