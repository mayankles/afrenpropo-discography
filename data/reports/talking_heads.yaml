    - >-
      Sire/Fly. Instrumental tracks cut at Studio Davout in Paris, vocals and overdubs finished
      at Sigma Sound in New York, August–December 1987. A return to the Afrobeat-inflected worldbeat
      of *Remain in Light* after two pop-leaning records. The band's eighth and final studio album;
      they entered hiatus after its release and formally disbanded in December 1991.
