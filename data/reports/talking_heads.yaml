    - >-
      Sire. The band's own studio versions of songs from Byrne's satirical film *True Stories*,
      set in a fictional Texas town — the film itself used different cast performances, later
      compiled separately in 2018. "Wild Wild Life" won two 1987 MTV Video Music Awards; the album's
      sixth track, "Radio Head," later gave a British band its name.
