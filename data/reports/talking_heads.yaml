      (vocals)
    - >-
      Sire. Self-produced comeback after a three-year hiatus spent on Tom Tom Club and Byrne/Eno's
      *My Life in the Bush of Ghosts*. "Burning Down the House" became the band's only U.S. top-ten
      single, and their highest-charting studio album (#15). The limited-edition Robert Rauschenberg
      sleeve — clear vinyl with rotating color discs — won a Grammy for Best Recording Package.
      Jonathan Demme's concert film *Stop Making Sense* (1984) toured this material with an expanded
      band, but is a live release and outside this report's scope.
