    - Tony Bongiovi & Lance Quinn, producers; Ed Stasium, engineer
    - >-
      Sire (Philips in continental Europe). Recorded at Sundragon and ODO Studios in New York,
      April–July 1977 — Harrison's first sessions with the band after joining that January. Clipped,
      wiry art-punk; "Psycho Killer" only reached #92 on the Hot 100 but became the band's signature.
      A 2024 deluxe reissue added outtakes and a live CBGB recording from October 1977.
