        instrument: drums
    - Poison Ivy and Lux Interior, producers; Earle Mankey, engineer
    - >-
      Epitaph. Recorded and mixed in May 1997 at Mankey's home studio. The only Cramps
      album made up entirely of Interior/Rorschach originals. A 2001 Vengeance reissue added
      four bonus tracks.
  - title: Fiends of Dope Island
    year: 2003
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals, harmonica, maracas
      - name: Poison Ivy Rorschach
        instrument: guitars, echo-theremin
      - name: Chopper Franklin
        instrument: bass, rhythm guitar on "Taboo"
      - name: Harry Drumdini
        instrument: drums
    - Poison Ivy and Lux Interior, producers; mixed and mastered at Earle Mankey's Psychedelic Shack
    - >-
      Vengeance. Recorded August 2002 in Hollywood and released on the band's own revived
      label. The title comes from the 1959 film *Fiend of Dope Island*. Covers include "Taboo"
      and Jerry Reed's "Oowee Baby." The last Cramps studio album.
