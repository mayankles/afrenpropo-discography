    - >-
      Creation (released through The Medicine Label). Recorded and mixed in 1994 at Earle
      Mankey's Psychedelic Shack in Thousand Oaks, California, and released October 11. Singles
      included "Ultra Twist," and the album closes on Bobby Troup's "Route 66." Chart
      positions: details limited.
