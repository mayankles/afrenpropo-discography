    - Alex Chilton, producer (organ on some tracks); mixed 1989 by Lux and Ivy at Present Time Recorders, North Hollywood; liner notes by Henry Rollins
    - >-
      Vengeance, released August 21, 2026 through The Cramps Inc. Material from the October
      1977 Ardent Studios sessions in Memphis, shelved after mixing in the late 1980s. It
      includes early versions of songs later heard on *Psychedelic Jungle*, as well as covers.
      Full personnel: details limited.
