- name: MEMPHIS DEBUT
  years: 1979–1980
  descriptor: Alex Chilton & the Original Two-Guitar Lineup
  columns:
  - Album / Year
  - Core Members
  - Collaborators / Producers
  - Label / Notes
  albums:
  - title: Songs the Lord Taught Us
    year: 1980
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals
      - name: Poison Ivy Rorschach
        instrument: guitar
      - name: Bryan Gregory
        instrument: guitar
      - name: Nick Knox
        instrument: drums
    - Alex Chilton, producer, and credited as "Booker C" on organ on "Fever"; John Hampton, engineer
    - >-
      Illegal (UK) / I.R.S. (US). Recorded 1979–1980 at Phillips Recording in Memphis. A
      bass-less, reverb-heavy debut built on rockabilly, garage and surf covers, including
      the Sonics' "Strychnine" and a "Fever" taken from Little Willie John. "Garbageman" was the
      only single. Later critics rated it highly, and Rolling Stone put it on a 2020 list of
      the best albums of 1980.
- name: THE KID CONGO ERA
  years: 1981–1983
  descriptor: Los Angeles, Lawsuits & a Live Rescue
  columns:
  - Album / Year
  - Core Members
  - Collaborators / Producers
  - Label / Notes
  albums:
  - title: Psychedelic Jungle
    year: 1981
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals
      - name: Poison Ivy Rorschach
        instrument: guitar
      - name: Kid Congo Powers
        instrument: guitar
      - name: Nick Knox
        instrument: drums
    - Self-produced by the Cramps; Paul McKenna, engineer
    - >-
      I.R.S. (US/UK). Recorded January 1981 at A&M Studios in Hollywood, released March 27.
      Seven of the 14 tracks are Interior/Rorschach originals, with the rest drawn from 1950s
      and 60s rock and roll, rockabilly and garage singles, including "Green Door" and "Goo Goo
      Muck." The latter found new audiences through *The Texas Chainsaw Massacre Part 2* (1986)
      and the TV series *Wednesday*. Its release was followed by the royalty dispute with
      Miles Copeland that stalled new releases until 1983.
  - title: Smell of Female
    year: 1983
    format: Live
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals, harmonica, percussion
      - name: Poison Ivy Rorschach
        instrument: lead guitar, bass
      - name: Kid Congo Powers
        instrument: guitar
      - name: Nick Knox
        instrument: drums
    - The Cramps, producers; Paul McKenna, engineer; Eddy Schreyer, mastering
    - >-
      Big Beat (UK) / Enigma (US) / New Rose (France). Recorded February 25–26, 1983 at the
      Peppermint Lounge in New York, as the court case kept the band from issuing studio
      work. Short at 20:16 in its original form, but expanded to 32:54 with bonus tracks
      later. Includes "Faster Pussycat" and the Count Five's "Psychotic Reaction." It reached
      No. 74 on the UK albums chart. Powers left around this time, with no reason given.
  - title: …Off the Bone
    year: 1983
    format: Compilation
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals
      - name: Poison Ivy Rorschach
        instrument: guitar
      - name: Bryan Gregory
        instrument: guitar
      - name: Kid Congo Powers
        instrument: guitar
      - name: Nick Knox
        instrument: drums
    - Alex Chilton and the Cramps, producers (1977–1979 material)
    - >-
      Illegal (UK). A 15-track collection of the early singles plus a cut from the *Gravest
      Hits* EP, including "Human Fly," "Surfin' Bird," "Garbage Man," "Fever" and "Goo Goo
      Muck (Single Mix)." Its first pressing had an anaglyph 3D cover with red-and-blue glasses
      in the sleeve. It peaked at No. 44 on the UK albums chart.
- name: THE BIG BEAT YEARS
  years: 1986–1991
  descriptor: Bass Arrives, Knox Leaves
  columns:
  - Album / Year
  - Core Members
  - Collaborators / Producers
  - Label / Notes
  albums:
  - title: A Date with Elvis
    year: 1986
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals
      - name: Poison Ivy Rorschach
        instrument: guitars, bass, vocals on two tracks
      - name: Nick Knox
        instrument: drums, bongos
    - The Cramps, producers; Steve McMillan and Mark Ettel, engineers; the McMartin Preschool Choir, with Fur Dixon, on "People Ain't No Good"
    - >-
      Big Beat (UK) / Enigma (US, 1990). Recorded at Ocean Way in Hollywood; sources
      differ on whether it was early or fall 1985. Ivy played the bass, and Fur Dixon joined
      for the world tour. "Can Your Pussy Do the Dog?" was the band's first UK singles-chart
      entry, and the album reached No. 34 in the UK. "Kizmiaz" is the only Cramps album track
      sung by Ivy.
  - title: Stay Sick!
    year: 1990
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals
      - name: Poison Ivy Rorschach
        instrument: guitar
      - name: Candy Del Mar
        instrument: bass
      - name: Nick Knox
        instrument: drums
    - Poison Ivy, producer; Steve Macmillan, engineer
    - >-
      Enigma. Recorded in 1989 at Music Grinder Studios in Hollywood and released February
      12, 1990. Nick Knox's last studio album. It produced "Bikini Girls with Machine Guns,"
      the band's only UK top-40 single (No. 35), and closes on a cover of Jimmie Rodgers'
      "Muleskinner Blues." The title is a tribute to a saying of the TV horror host Ghoulardi.
      It reached No. 62 in the UK.
  - title: Look Mom No Head!
    year: 1991
    cells:
    - players:
      - name: Lux Interior
        instrument: vocals
      - name: Poison Ivy Rorschach
        instrument: guitar
      - name: Slim Chance
        instrument: bass
      - name: Jim Sclavunos
        instrument: drums
    - Poison Ivy, producer; Steve Macmillan, engineer; Iggy Pop, guest vocals on "Miniskirt Blues"
    - >-
      Restless/Enigma (US) / Big Beat via Ace (UK). Recorded and mixed at Ocean Way Studios
      in Hollywood, June 21 to July 14, 1991, with a new rhythm section following the exits
      of Del Mar and Knox. "Miniskirt Blues" is a cover of a 1967 Flower Children song.
