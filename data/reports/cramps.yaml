artist: The Cramps
subtitle: Musicians & Instrumentation (1980–2026)
synopsis:
- >-
  **Lux Interior** and **Poison Ivy Rorschach** met in Sacramento
  in 1972, bonded over art and record collecting, and moved to Akron, Ohio in 1973 and then to
  New York in 1975, where they landed in the CBGB scene. The first full lineup, in April 1976,
  paired the couple with guitarist **Bryan Gregory** and drummer Pam Balam; Miriam Linna replaced
  Balam, and **Nick Knox** took the drum stool in September 1977. Nobody else in the New York
  scene sounded like them: no bass, a wall of reverb-soaked guitar, and a singer who treated
  1950s rockabilly, surf, garage and horror-movie kitsch as scripture. They cut their first
  singles in Memphis in 1977 with **Alex Chilton** producing at Ardent Studios, and Miles Copeland
  signed them to I.R.S. Records.
- >-
  Lux and Ivy are the constant. Lux was the frontman, lyricist and visual designer, and Ivy was
  the guitarist, arranger and, on most records, co-producer, the person who decided what a song
  needed and what it didn't. Everyone else rotated around them. Chilton returned for the 1980
  debut *Songs the Lord Taught Us*, tracked at Phillips Recording in Memphis. Soon afterward the
  band relocated to Los Angeles, where Gregory was replaced by **Kid Congo Powers** of the Gun Club.
  That lineup made *Psychedelic Jungle* (1981), the band's first self-produced album, and then
  went quiet. A dispute with Copeland over royalties and creative rights led to a court case that
  held up new releases until 1983. The live album *Smell of Female* and the singles compilation
  *…Off the Bone* arrived that year as stopgaps, and Powers left around the same time.
- >-
  The band's second life began with 1986's *A Date with Elvis*, on the independent Big Beat label,
  with Ivy covering bass herself before **Candy Del Mar** became the permanent bassist. They
  stayed on that footing through *Stay Sick!* (1990), the last studio album with Knox, whose
  departure with Del Mar in 1991 opened the era of **Slim Chance** on bass and a revolving drum
  chair: Jim Sclavunos on *Look Mom No Head!*, then **Harry Drumdini**, who drummed from 1993
  to 2003 and again from 2006 to 2009. *Flamejob* (1994) and *Big Beat from Badsville* (1997)
  were recorded at Earle Mankey's home studio in Thousand Oaks. The band made some of its
  most visible pop-culture appearances in these years, including a spot on *Late Night with
  Conan O'Brien* in 1994 and a 1995 Halloween episode of *Beverly Hills, 90210*. Their only
  UK top-40 single, "Bikini Girls with Machine Guns," came from *Stay Sick!*.
- >-
  *Fiends of Dope Island* (2003), the first release on their revived Vengeance Records, was the
  last studio album. The band played its final show on November 4, 2006, at the Marquee Theater
  in Tempe, Arizona. Bryan Gregory had died on January 10, 2001, at age 49, and Lux Interior died
  on February 4, 2009, of an aortic dissection, which ended the band. Poison Ivy has since looked
  after the catalog. In 2026 she revived Vengeance with In The Red's Larry Hardy and engineer
  Jimmy Maslon under the banner The Cramps Inc., and issued *Gravest Gravy*, a set of shelved
  October 1977 Chilton sessions. The Cramps never charted high, and their influence is easier to
  hear in psychobilly, garage punk and goth than in their sales.
scope_note: >-
  Scope: all studio albums from *Songs the Lord Taught Us* (1980) to *Fiends of Dope Island* (2003),
  plus three releases that are not studio albums but were chosen by the club or sit in the
  catalog's gaps, each tagged in the table: the live album *Smell of Female* (1983), the
  compilation *…Off the Bone* (1983), and the archival *Gravest Gravy* (2026), a collection of
  1977 sessions. Excluded: the EPs *Gravest Hits* (1979), *Blues Fix* (1992) and *Ultra Twist*
  (1994); the other compilations (*Bad Music for Bad People*, *Greatest Hits*, *How to Make a
  Monster*); the live album *RockinnReelininAucklandNewZealandXXX* (1987); and the filmed
  *Live at Napa State Mental Hospital* (1978). These are omitted to keep the report focused
  on the core catalog. *…Off the Bone* is a compilation of singles and EP tracks, and some
  of its material is shared with other releases. *Songs the Lord Taught Us* was released on
  Illegal in the UK and I.R.S. in the US, and sources differ on which counts as the original
  label. No side projects are covered, since the band was the constant and the members' other
  work was minor.
