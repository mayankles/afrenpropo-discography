name: Club sync

# The club listens to one artist per fortnight, so a daily check is plenty.
# workflow_dispatch is deliberate: GitHub disables cron on public repos after
# 60 days of inactivity, and a manual button is the way back in.
on:
  schedule:
    - cron: "0 8 * * *"
  # has_report in ratings.json is a snapshot taken when the stats last ran, so
  # merging a report PR left the site saying "No report yet" until the next
  # morning. Refresh as soon as a report lands. The stats commit only touches
  # data/, which this filter excludes, so it cannot retrigger itself.
  push:
    branches: [main]
    paths:
      - "html/**"
  workflow_dispatch:

concurrency:
  group: club-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Derived data, no prose -- safe to land on main directly.
      - name: Refresh the stats data
        env:
          CLUB_SHEET_ID: ${{ secrets.CLUB_SHEET_ID }}
        run: python3 scripts/club.py stats

      - name: Commit refreshed stats
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "Ratings unchanged."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ratings.json
            git commit -m "Refresh club stats from the spreadsheet"
            git push
          fi

      # Runs after the stats refresh on purpose: if the green row is missing or
      # ambiguous this step fails the build, and the ratings should update anyway.
      - name: Read the spreadsheet
        id: club
        env:
          CLUB_SHEET_ID: ${{ secrets.CLUB_SHEET_ID }}
        run: python3 scripts/club.py check

      # The green row stays green for a fortnight. Without this guard the
      # daily schedule would open the same pull request fourteen times.
      - name: Is a report already in flight?
        id: branch
        if: steps.club.outputs.needed == 'true'
        env:
          SLUG: ${{ steps.club.outputs.slug }}
        run: |
          BRANCH="report/${SLUG}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $BRANCH already exists -- nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      # The club often picks an artist before choosing the albums. Interpolating
      # an empty list into "highlight these five albums:" produced a prompt that
      # contradicted itself, and the run came back in seconds having written
      # nothing. Build the paragraph to match reality instead.
      - name: Build the highlight instruction
        id: highlight
        if: steps.club.outputs.needed == 'true' && steps.branch.outputs.exists == 'false'
        env:
          ALBUMS: ${{ steps.club.outputs.albums }}
        run: |
          {
            echo "text<<PROMPT_EOF"
            if [ -z "${ALBUMS// /}" ]; then
              echo "The club has not chosen the albums for this session yet, so"
              echo "highlight nothing. Omit the highlight-masterpiece class and the"
              echo "leading star entirely -- CLAUDE.md treats highlights as optional."
              echo "Cover the catalogue as the spec describes and leave the"
              echo "highlighting to a later pass."
            else
              echo "Highlight these albums, which are what the club is listening to"
              echo "this fortnight: ${ALBUMS}"
              echo ""
              echo "Every highlighted album needs both the highlight-masterpiece class"
              echo "and a leading star, per CLAUDE.md. If any of them is a live album,"
              echo "compilation or side-project release, include it anyway and add the"
              echo ".fmt format tag so the classification stays honest."
            fi
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # Claude writes YAML only. Rendering, escaping, era colours and the
      # star highlighting are scripts/render_report.py's job, so the run needs
      # no shell or git access at all.
      - name: Write the report
        if: steps.club.outputs.needed == 'true' && steps.branch.outputs.exists == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            Write a discography report for ${{ steps.club.outputs.artist }}.

            CLAUDE.md in the repository root is the complete specification.
            Read it first and follow it exactly. data/reports/talking_heads.yaml
            is a worked example -- read that too.

            ${{ steps.highlight.outputs.text }}

            Save the report as YAML to data/reports/${{ steps.club.outputs.slug }}.yaml
            and change nothing else. Do not write HTML: the renderer produces it.

            Check your work before finishing:
              python3 scripts/render_report.py data/reports/${{ steps.club.outputs.slug }}.yaml --validate-only

            Research before you write. Verify album years, labels, personnel and
            producers against sources rather than writing from memory, and search
            for releases newer than your training data. Where you cannot confirm
            a detail, write "details limited" rather than plausible filler --
            a gap is fine, an invention is not.

      # A first pass can miss a cell count or a paragraph count, which a second
      # pass fixes cheaply. Soft-fail here and hand the errors back rather than
      # throwing away eight minutes of research over a fixable mistake.
      - name: Validate the report
        id: validate
        if: steps.club.outputs.needed == 'true' && steps.branch.outputs.exists == 'false'
        continue-on-error: true
        env:
          SLUG: ${{ steps.club.outputs.slug }}
          ALBUMS: ${{ steps.club.outputs.albums }}
        run: |
          set +e
          OUT=$(python3 scripts/render_report.py "data/reports/${SLUG}.yaml" \
                  --validate-only --highlight "$ALBUMS" 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "problems<<VALIDATOR_EOF"
            echo "$OUT"
            echo "VALIDATOR_EOF"
            if [ $CODE -eq 0 ]; then echo "ok=true"; else echo "ok=false"; fi
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fix the report
        if: steps.validate.outputs.ok == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            data/reports/${{ steps.club.outputs.slug }}.yaml does not validate.
            The validator reported:

            ${{ steps.validate.outputs.problems }}

            Fix the YAML so it validates. Re-read CLAUDE.md for the field rules
            if a message is unclear, and check with:

              python3 scripts/render_report.py data/reports/${{ steps.club.outputs.slug }}.yaml --validate-only

            If a message says an album the club chose is missing from the report,
            the fix is to add that album with real researched detail -- not to
            rename an existing row to match. Change nothing outside that one file.

      - name: Render the report
        if: steps.club.outputs.needed == 'true' && steps.branch.outputs.exists == 'false'
        env:
          SLUG: ${{ steps.club.outputs.slug }}
          ALBUMS: ${{ steps.club.outputs.albums }}
        run: |
          python3 scripts/render_report.py "data/reports/${SLUG}.yaml" \
            --highlight "$ALBUMS"

      - name: Open a pull request
        if: steps.club.outputs.needed == 'true' && steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ARTIST: ${{ steps.club.outputs.artist }}
          SLUG: ${{ steps.club.outputs.slug }}
          ALBUMS: ${{ steps.club.outputs.albums }}
          RETRIED: ${{ steps.validate.outputs.ok == 'false' && 'yes' || 'no' }}
        run: |
          SOURCE="data/reports/${SLUG}.yaml"
          PAGE="html/${SLUG}_discography.html"
          for f in "$SOURCE" "$PAGE"; do
            if [ ! -f "$f" ]; then
              echo "::error::expected $f to exist by now"
              exit 1
            fi
          done
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$SOURCE" "$PAGE"
          git commit -m "Add ${ARTIST} discography report"
          git push -u origin "$BRANCH"

          NOTE=""
          if [ "$RETRIED" = "yes" ]; then
            NOTE=$'\n\nThe first draft failed validation and was corrected on a second\npass. Worth a slightly closer read than usual.'
          fi
          gh pr create \
            --title "Add ${ARTIST} discography report" \
            --body "$(cat <<EOF
          Generated automatically because **${ARTIST}** is the green-highlighted
          artist in the club spreadsheet and no report existed yet.

          Albums highlighted: ${ALBUMS:-none chosen yet}

          Review \`${SOURCE}\` -- that is the source. \`${PAGE}\` is generated
          from it by \`scripts/render_report.py\` and can be regenerated at any
          time, so read the YAML and treat the HTML as a build artifact.

          **Please read it before merging.** The renderer guarantees the markup,
          not the facts: check the years, labels, personnel and producers, and
          anything the report says about living people.${NOTE}
          EOF
          )"
